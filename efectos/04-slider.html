<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slider sin JavaScript</title>

  <link rel="stylesheet" href="../css/04-slider.css">
  <link rel="stylesheet" href="../css/shared.css">
  

</head>

<body>

  <!-- Botón modo oscuro -->
  <button class="dark-btn" id="darkToggle">🌙 Modo oscuro</button>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-content">
      <h1>Slider sin JavaScript</h1>

      <p>
        Galería interactiva creada solo con HTML y CSS. Haz clic en los controles para cambiar de imagen.
      </p>

      <a class="volver-btn" href="../index.html">
        ← Volver a la página principal
      </a>
    </div>
  </section>


  <!-- SLIDER -->
  <section class="slider">

    <!-- Controles -->
    <input type="radio" name="slide" id="s1" aria-label="Mostrar imagen 1" checked>
    <input type="radio" name="slide" id="s2" aria-label="Mostrar imagen 2">
    <input type="radio" name="slide" id="s3" aria-label="Mostrar imagen 3">

    <!-- Imágenes -->
    <div class="slides">

      <div class="img">
        <img src="../img/slide1.webp" alt="Paisaje de la primera diapositiva">
      </div>

      <div class="img">
        <img src="../img/slide2.webp" alt="Paisaje de la segunda diapositiva">
      </div>

      <div class="img">
        <img src="../img/slide3.webp" alt="Paisaje de la tercera diapositiva">
      </div>

     

    </div>

    <!-- Botones -->
    <div class="nav">
      <label for="s1" aria-label="Ir a imagen 1"></label>
      <label for="s2" aria-label="Ir a imagen 2"></label>
      <label for="s3" aria-label="Ir a imagen 3"></label>
    </div>

  </section>


  <!-- FOOTER -->
  <footer class="site-footer">
    <p>Hecho con ❤️ y CSS muy actual <span>Showcase CSS</span></p>
  </footer>


  <!-- SCRIPT MODO OSCURO -->
  <script>
    const toggle = document.getElementById("darkToggle");
    toggle.addEventListener("click",()=>{
      document.body.classList.toggle("dark");
      toggle.textContent =
        document.body.classList.contains("dark")
        ? "🌞 Modo claro"
        : "🌙 Modo oscuro";
    });
  </script>

</body>
</html>
